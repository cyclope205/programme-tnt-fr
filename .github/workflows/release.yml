name: Release zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip_release:
    name: Zip and attach release asset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Zip the integration directory
        shell: bash
        run: |
          cd custom_components/programme_tnt_fr
          zip programme_tnt_fr.zip -r ./

      - name: Upload the ZIP to the release
        uses: softprops/action-gh-release@v2
        with:
          files: custom_components/programme_tnt_fr/programme_tnt_fr.zip
